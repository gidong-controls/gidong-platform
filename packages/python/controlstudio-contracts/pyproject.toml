[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlstudio-contracts"
version = "0.1.0"
description = "Versioned public Python contracts for ControlStudio Platform"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
