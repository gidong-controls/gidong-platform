[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlstudio-platform-conformance"
version = "0.1.0"
description = "Black-box conformance runner for public ControlStudio contracts"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["typing-extensions>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
controlstudio-conformance = "controlstudio_conformance.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
