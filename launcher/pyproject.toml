[project]
name = "controlstudio-launcher"
version = "0.1.0"
description = "User-invoked Windows launcher for the ControlStudio Host"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "controlstudio-host",
]

[tool.uv.sources]
controlstudio-host = { path = "../host", editable = true }

[project.scripts]
controlstudio = "controlstudio_launcher.cli:main"

[project.gui-scripts]
controlstudio-app = "controlstudio_launcher.cli:gui_main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlstudio_launcher"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
