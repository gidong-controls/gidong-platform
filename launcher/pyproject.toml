[project]
name = "controlstudio-launcher"
version = "0.1.0"
description = "User-invoked Windows launcher for the ControlStudio Host"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "controlstudio-host",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
]

[tool.uv.sources]
controlstudio-host = { path = "../host", editable = true }

[project.scripts]
controlstudio = "controlstudio_launcher.cli:main"

[project.gui-scripts]
controlstudio-app = "controlstudio_launcher.cli:gui_main"

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlstudio_launcher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
