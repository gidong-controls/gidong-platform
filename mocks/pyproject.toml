[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlstudio-platform-mocks"
version = "0.1.0"
description = "Public deterministic Agent Protocol and MCP Product Contract mocks"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
controlstudio-mock-agent = "controlstudio_mocks.agent:main"
controlstudio-mock-mcp = "controlstudio_mocks.mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
